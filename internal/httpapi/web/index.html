<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>acquire · requests</title>
<style>
  :root {
    --bg:#0B0F19; --surface:#11161F; --surface2:#161B26; --border:#1F2633;
    --text:#C9D1D9; --muted:#AEB8C2; --dim:#6E7787; --accent:#58A6FF;
    --green:#2EA043; --amber:#F2B233; --red:#F85149;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif; }
  header { display:flex; align-items:center; gap:12px; padding:16px 24px;
    border-bottom:1px solid var(--border); }
  header h1 { font-size:18px; margin:0; letter-spacing:.02em; }
  header .who { margin-left:auto; color:var(--muted); font-size:13px; }
  main { max-width:1000px; margin:0 auto; padding:24px; }
  .bar { display:flex; gap:8px; margin-bottom:20px; }
  input, button { font:inherit; }
  input[type=search], input.text {
    flex:1; padding:10px 14px; background:var(--surface); border:1px solid var(--border);
    border-radius:8px; color:var(--text); }
  button { padding:9px 16px; border-radius:8px; border:1px solid var(--border);
    background:var(--surface2); color:var(--text); cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#001; font-weight:600; }
  button.primary:hover { filter:brightness(1.08); }
  button:disabled { opacity:.5; cursor:default; }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin:24px 0 12px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:14px; }
  .card { background:var(--surface); border:1px solid var(--border); border-radius:10px; overflow:hidden; }
  .card img { width:100%; aspect-ratio:2/3; object-fit:cover; display:block; background:var(--surface2); }
  .card .b { padding:10px; }
  .card .t { font-weight:600; font-size:13px; margin-bottom:4px; }
  .card .y { color:var(--dim); font-size:12px; margin-bottom:8px; }
  .card button { width:100%; padding:6px; font-size:12px; }
  table { width:100%; border-collapse:collapse; }
  th,td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--border); font-size:13px; }
  th { color:var(--muted); font-weight:500; }
  .status { font-size:12px; padding:2px 8px; border-radius:999px; display:inline-block; }
  .status.pending{ background:#25314a; color:var(--accent); }
  .status.downloading{ background:#3a2f10; color:var(--amber); }
  .status.packaging{ background:#25314a; color:var(--accent); }
  .status.fulfilled{ background:#12351f; color:var(--green); }
  .status.failed{ background:#3a1414; color:var(--red); }
  .status.grabbed{ background:#25314a; color:var(--accent); }
  .status.queued{ background:#25314a; color:var(--accent); }
  .status.completed{ background:#12351f; color:var(--green); }
  .muted { color:var(--muted); }
  .small { font-size:11px; margin-top:3px; }
  .row-actions button { padding:4px 10px; font-size:12px; }
  #signin { text-align:center; padding:60px; }
  /* Square progress bar: accent fill on a border-coloured track. */
  .pbar { height:6px; background:var(--surface2); border:1px solid var(--border); min-width:120px; }
  .pbar-fill { height:100%; background:var(--accent); transition:width .4s linear; }
  .chips { display:inline-flex; gap:6px; flex-wrap:wrap; margin-left:10px; vertical-align:middle; }
  .chip { font-size:11px; padding:2px 8px; border:1px solid var(--border);
          background:var(--surface2); color:var(--muted); font-weight:400; }
  .chip.ok { border-color:#1d3a26; color:var(--green); }
  .chip.bad { border-color:#3a1414; color:var(--red); }
</style>
</head>
<body>
<header>
  <h1>&gt;a acquire</h1>
  <span class="who" id="who"></span>
</header>
<main>
  <div id="signin" style="display:none">
    <p class="muted">Sign in to request and manage downloads.</p>
    <button class="primary" onclick="login()">Sign in</button>
  </div>
  <div id="appui" style="display:none">
    <div class="bar">
      <input type="search" id="q" placeholder="Search a movie or show to request…" />
      <button class="primary" onclick="doSearch()">Search</button>
    </div>
    <div id="results" class="grid"></div>
    <h2>requests</h2>
    <table>
      <thead><tr><th>title</th><th>status</th><th>detail</th><th></th></tr></thead>
      <tbody id="wanted"></tbody>
    </table>
    <h2>downloads <span id="clients" class="chips"></span></h2>
    <table>
      <thead><tr><th>title</th><th>state</th><th>progress</th><th></th></tr></thead>
      <tbody id="downloads"></tbody>
    </table>
  </div>
</main>
<script type="module">
// Minimal OIDC Authorization-Code + PKCE, no dependencies.
const enc = new TextEncoder();
const b64url = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf)))
  .replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
async function sha256(s){ return await crypto.subtle.digest('SHA-256', enc.encode(s)); }
const rand = (n=64) => { const a=new Uint8Array(n); crypto.getRandomValues(a);
  return Array.from(a,x=>('0'+(x&0xff).toString(16)).slice(-2)).join(''); };

let CFG=null, TOKEN=null, ADMIN=false, SUB='';
const base = location.pathname.replace(/\/[^/]*$/, '/'); // e.g. /acquire/
const redirectUri = location.origin + base + 'callback';

async function config(){
  const r = await fetch('api/config'); return r.json();
}
async function login(){
  const verifier = rand(); const challenge = b64url(await sha256(verifier));
  const state = rand(16);
  sessionStorage.setItem('acq_v', verifier); sessionStorage.setItem('acq_s', state);
  const p = new URLSearchParams({
    client_id: CFG.oidcClientId, redirect_uri: redirectUri, response_type: 'code',
    scope: 'openid profile email', state, code_challenge: challenge, code_challenge_method: 'S256',
  });
  location.href = `${CFG.oidcIssuer}/protocol/openid-connect/auth?${p}`;
}
window.login = login;

async function exchange(code){
  const verifier = sessionStorage.getItem('acq_v');
  const p = new URLSearchParams({
    grant_type:'authorization_code', client_id:CFG.oidcClientId, code,
    redirect_uri:redirectUri, code_verifier:verifier });
  const r = await fetch(`${CFG.oidcIssuer}/protocol/openid-connect/token`,
    { method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body:p });
  if(!r.ok) throw new Error('token exchange failed');
  return r.json();
}
function parseJwt(t){ try { return JSON.parse(atob(t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))); } catch { return {}; } }

async function api(path, opts={}){
  opts.headers = Object.assign({'Authorization':'Bearer '+TOKEN}, opts.headers||{});
  const r = await fetch('api/'+path, opts);
  if(r.status===401){ login(); throw new Error('unauth'); }
  return r;
}

async function doSearch(){
  const q = document.getElementById('q').value.trim();
  if(!q) return;
  const hits = await (await api('discover?q='+encodeURIComponent(q))).json();
  const el = document.getElementById('results'); el.innerHTML='';
  for(const h of hits){
    const card = document.createElement('div'); card.className='card';
    card.innerHTML = `${h.posterUrl?`<img src="${escapeAttr(h.posterUrl)}" loading="lazy">`:`<div style="aspect-ratio:2/3;background:var(--surface2)"></div>`}
      <div class="b"><div class="t">${escapeHtml(h.title)}</div>
      <div class="y">${h.year||''} · ${h.mediaType}</div>
      ${h.inLibrary?`<button disabled>in library</button>`:`<button class="primary">request</button>`}</div>`;
    if(!h.inLibrary){
      card.querySelector('button').onclick = () => request(h);
    }
    el.appendChild(card);
  }
}
window.doSearch = doSearch;

async function request(h){
  await api('wanted', { method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ tmdbId:h.tmdbId, mediaType:h.mediaType, title:h.title, year:h.year, posterUrl:h.posterUrl }) });
  loadWanted();
}
async function grab(id){
  const src = prompt('Paste a magnet link or .torrent URL to grab:');
  if(!src) return;
  const r = await api('wanted/'+id+'/grab', { method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ source: src, adapter: 'qbittorrent' }) });
  if(!r.ok) alert('grab failed: '+await r.text());
  else loadWanted();
}
async function autograb(id){
  const r = await api('wanted/'+id+'/autograb', { method:'POST' });
  if(!r.ok) alert('find & grab failed: '+await r.text());
  else loadWanted();
}
async function del(id){ if(confirm('Remove this request?')){ await api('wanted/'+id, {method:'DELETE'}); loadWanted(); } }
window.grab = grab; window.autograb = autograb; window.del = del;

function statusPill(s){ return `<span class="status ${s}">${s}</span>`; }

// ── formatting helpers ──────────────────────────────────────────────────────
function fmtBytes(n){
  if(!n || n<=0) return '';
  const u=['B','KB','MB','GB','TB']; let i=0, v=n;
  while(v>=1024 && i<u.length-1){ v/=1024; i++; }
  return (v>=10||i===0? Math.round(v) : v.toFixed(1))+' '+u[i];
}
function fmtSpeed(bps){ return bps>0 ? fmtBytes(bps)+'/s' : ''; }
function fmtEta(sec){
  if(sec==null || sec<0) return '';
  if(sec<60) return sec+'s';
  if(sec<3600) return Math.round(sec/60)+'m';
  return Math.floor(sec/3600)+'h '+Math.round(sec%3600/60)+'m';
}
// Square, accent-filled bar — the house progress convention.
function progressBar(pct){
  const p = Math.max(0, Math.min(100, pct||0));
  return `<div class="pbar"><div class="pbar-fill" style="width:${p.toFixed(1)}%"></div></div>`;
}

// DOWNLOADS is keyed "adapter:client_job_id" and updated in place from the
// event stream, so a progress bar moves without refetching the whole list.
let DOWNLOADS = new Map();
function dlKey(d){ return d.adapter+':'+d.clientJobId; }
function activeFor(wantedId){
  for(const d of DOWNLOADS.values()){
    if(d.wantedId===wantedId && (d.state==='downloading'||d.state==='queued')) return d;
  }
  return null;
}

function rowHtml(w){
  const grabbable = ['pending','failed'].includes(w.status);
  const admin = ADMIN ? `<div class="row-actions">
    ${grabbable && CFG.autoGrab ? `<button class="primary" onclick="autograb('${w.id}')">find &amp; grab</button>` : ''}
    ${grabbable ? `<button onclick="grab('${w.id}')">magnet</button>` : ''}
    <button onclick="del('${w.id}')">remove</button></div>` : '';
  const d = activeFor(w.id);
  const live = d ? `${progressBar(d.progressPct)}
    <div class="muted small">${d.progressPct.toFixed(0)}% · ${fmtBytes(d.bytesDone)}${d.bytesTotal?' / '+fmtBytes(d.bytesTotal):''}
    ${fmtSpeed(d.speedBps)?' · '+fmtSpeed(d.speedBps):''}${fmtEta(d.etaSec)?' · '+fmtEta(d.etaSec)+' left':''}
    ${d.nativeState?' · '+escapeHtml(d.nativeState):''}</div>` : '';
  return `<tr><td>${escapeHtml(w.title)} <span class="muted">${w.year||''}</span></td>
    <td>${statusPill(w.status)}</td>
    <td class="muted">${escapeHtml(w.detail||'')}${live}</td><td>${admin}</td></tr>`;
}
async function loadWanted(){
  const items = await (await api('wanted')).json();
  document.getElementById('wanted').innerHTML = items.map(rowHtml).join('');
}

function dlRowHtml(d){
  const ctl = ADMIN ? `<div class="row-actions">
    ${d.state==='downloading'||d.state==='queued' ? `<button onclick="dlctl('${d.adapter}','${d.clientJobId}','pause')">pause</button>
      <button onclick="dlctl('${d.adapter}','${d.clientJobId}','resume')">resume</button>` : ''}
    <button onclick="dlctl('${d.adapter}','${d.clientJobId}','cancel')">cancel</button></div>` : '';
  const peers = d.seeders!=null ? ` · ${d.seeders} seeds` : (d.health!=null ? ` · health ${(d.health/10).toFixed(0)}%` : '');
  return `<tr><td>${escapeHtml(d.title||d.clientJobId)}<div class="muted small">${escapeHtml(d.adapter)}${peers}</div></td>
    <td>${statusPill(d.state)}<div class="muted small">${escapeHtml(d.nativeState||'')}</div></td>
    <td>${progressBar(d.progressPct)}<div class="muted small">${d.progressPct.toFixed(0)}% · ${fmtBytes(d.bytesDone)}${d.bytesTotal?' / '+fmtBytes(d.bytesTotal):''}${fmtSpeed(d.speedBps)?' · '+fmtSpeed(d.speedBps):''}${fmtEta(d.etaSec)?' · '+fmtEta(d.etaSec)+' left':''}</div></td>
    <td>${ctl}</td></tr>`;
}
function renderDownloads(){
  const rows = [...DOWNLOADS.values()].sort((a,b)=>{
    const act = s => (s==='downloading'||s==='queued') ? 0 : 1;
    return act(a.state)-act(b.state) || (b.updatedAt||'').localeCompare(a.updatedAt||'');
  });
  document.getElementById('downloads').innerHTML = rows.map(dlRowHtml).join('')
    || `<tr><td colspan="4" class="muted">no downloads yet.</td></tr>`;
}
async function loadDownloads(){
  const items = await (await api('downloads')).json();
  DOWNLOADS = new Map(items.map(d => [dlKey(d), d]));
  renderDownloads();
}
async function loadClients(){
  const items = await (await api('clients')).json();
  document.getElementById('clients').innerHTML = items.map(c => {
    const bits = [];
    if(c.down_bps>0) bits.push('↓ '+fmtSpeed(c.down_bps));
    if(c.free_disk_bytes) bits.push(fmtBytes(c.free_disk_bytes)+' free');
    for(const k in (c.detail||{})) bits.push(escapeHtml(c.detail[k]));
    if(c.paused) bits.push('paused');
    return `<span class="chip ${c.reachable?'ok':'bad'}">${escapeHtml(c.name)}${bits.length?' · '+bits.join(' · '):''}</span>`;
  }).join('');
}
async function dlctl(adapter, id, action){
  if(action==='cancel' && !confirm('Cancel this download?')) return;
  await api(`downloads/${encodeURIComponent(adapter)}/${encodeURIComponent(id)}/${action}`, {method:'POST'});
  loadDownloads();
}
window.dlctl = dlctl;

function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
// Attribute values additionally must not carry a javascript:/data: scheme.
function escapeAttr(s){
  const v = String(s||'');
  return /^https?:\/\//i.test(v) ? escapeHtml(v) : '';
}

// The stream is authenticated, so it is read with fetch-streaming (EventSource
// cannot send a bearer). "changed" means refetch the lists; "download" carries a
// telemetry row we apply in place. A fallback poll covers a dropped stream.
async function liveStatus(){
  let attempt = 0;
  for(;;){
    try {
      const r = await fetch('api/events', {
        headers: {'Authorization':'Bearer '+TOKEN, 'Accept':'text/event-stream'},
      });
      if(!r.ok || !r.body) throw new Error('stream '+r.status);
      attempt = 0;
      const reader = r.body.getReader(); const dec = new TextDecoder(); let buf='';
      for(;;){
        const {value, done} = await reader.read();
        if(done) break;
        buf += dec.decode(value, {stream:true});
        let i;
        while((i = buf.indexOf('\n\n')) >= 0){
          const frame = buf.slice(0, i); buf = buf.slice(i+2);
          let name='message', data='';
          for(const line of frame.split('\n')){
            if(line.startsWith('event: ')) name = line.slice(7).trim();
            else if(line.startsWith('data: ')) data += line.slice(6);
          }
          if(name==='download'){
            try {
              const d = JSON.parse(data);
              DOWNLOADS.set(dlKey(d), d);
              renderDownloads(); loadWanted();
            } catch {}
          } else if(name==='changed'){
            loadWanted(); loadDownloads();
          }
        }
      }
    } catch {}
    // Reconnect with backoff, then resync what we missed.
    const wait = Math.min(30000, 1000 * 2 ** Math.min(attempt++, 5));
    await new Promise(res => setTimeout(res, wait));
    try { await loadWanted(); await loadDownloads(); } catch {}
  }
}

async function boot(){
  CFG = await config();
  const url = new URL(location.href);
  if(url.searchParams.get('code')){
    // Validate the CSRF state before exchanging the code.
    const expect = sessionStorage.getItem('acq_s');
    if(!expect || url.searchParams.get('state') !== expect){
      history.replaceState({}, '', base);
      document.getElementById('signin').style.display='block';
      return;
    }
    sessionStorage.removeItem('acq_s');
    const tok = await exchange(url.searchParams.get('code'));
    TOKEN = tok.access_token;
    history.replaceState({}, '', base);
  }
  if(!TOKEN){ document.getElementById('signin').style.display='block'; return; }
  const claims = parseJwt(TOKEN);
  SUB = claims.sub||''; ADMIN = ((claims.realm_access||{}).roles||[]).includes(CFG.adminRole);
  document.getElementById('who').textContent = (claims.preferred_username||claims.email||'') + (ADMIN?' · admin':'');
  document.getElementById('appui').style.display='block';
  const q0 = new URL(location.href).searchParams.get('q');
  if(q0){ document.getElementById('q').value=q0; doSearch(); }
  loadWanted(); loadDownloads(); loadClients(); liveStatus();
  // Fallback poll — the live stream is the primary trigger.
  setInterval(() => { loadDownloads(); loadClients(); }, 30000);
}
boot();
</script>
</body>
</html>
