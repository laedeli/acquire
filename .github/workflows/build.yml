name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    # Migrations re-run on every boot with no tracking table, so they are only
    # as safe as a real double-boot proves. A real Postgres is the only way to
    # test that, and to test the 005 repair against a production-shaped row.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: acquire_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      TEST_DSN: postgres://postgres:test@localhost:5432/acquire_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      - name: the migration tests actually ran (they skip without a database)
        run: go test ./internal/store/ -run Migrate -v | grep -q "PASS: TestMigrateRepairsAProductionShapedProfileRow"

  console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: npm run build
        working-directory: web
      # The built console is committed because go:embed needs it without node.
      # Byte-comparing it against a fresh build does NOT work: the minifier picks
      # different short identifiers per run, so federation's remoteEntry.js is
      # never byte-identical across machines. Assert the build produced the
      # artifacts the shell actually loads instead — `npm run build` above
      # already type-checks the source, which is what catches a stale edit.
      - name: the build produced what the portal loads
        run: |
          set -e
          for f in \
            ../internal/httpapi/web/index.html \
            ../internal/httpapi/web/embed/assets/remoteEntry.js \
            ../internal/httpapi/web/embed/assets/console.css; do
            test -s "$f" || { echo "missing or empty: $f" >&2; exit 1; }
          done
          grep -q "./Console" ../internal/httpapi/web/embed/assets/remoteEntry.js \
            || { echo "remoteEntry does not expose ./Console" >&2; exit 1; }
        working-directory: web
