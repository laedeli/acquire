# The secret inputs (writeOnly in values.schema.json). The Deployments read them
# through secretKeyRef only, so no value ever appears in a pod spec.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "acquire.secretName" . }}
  labels:
    {{- include "acquire.labels" (dict "root" $ "component" "acquire") | nindent 4 }}
type: Opaque
data:
  database-url: {{ required "database.url is required" .Values.database.url | b64enc | quote }}
  oidc-service-client-secret: {{ required "oidc.serviceClientSecret is required" .Values.oidc.serviceClientSecret | b64enc | quote }}
  config-key: {{ required "config.key is required (the operator generates one when none is given)" .Values.config.key | b64enc | quote }}
  {{- with .Values.config.previousKey }}
  config-previous-key: {{ . | b64enc | quote }}
  {{- end }}
  {{- with .Values.tmdb.apiKey }}
  tmdb-api-key: {{ . | b64enc | quote }}
  {{- end }}
