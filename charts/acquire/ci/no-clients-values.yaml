# CI values: the defaults — the addon runs no download clients of its own, and
# only the required inputs are given. Rendered by .github/workflows/chart.yml
# and charts/chart_test.go. Nothing here is a real credential.
zaentrum:
  namespace: zaentrum-example
  hostname: zaentrum.example.org
  issuer: https://sso.example.org/realms/example
  issuerHostAliasIP: 192.0.2.10
  imagePullSecrets: [registry-pull]
  partOf: zaentrum-example-addons
  events:
    brokers: event-brokers.event-streaming.svc:9093
    topicPrefix: zaentrum-example.
    tlsSecret: event-client-tls
  media:
    claimName: media

database:
  url: postgres://acquire:ci-database-password@postgres.example.org:5432/acquire?sslmode=require
oidc:
  serviceClientSecret: ci-service-client-secret
config:
  key: Y2ktb25seS1jb25maWcta2V5LW5vdC1hLXNlY3JldCE=
