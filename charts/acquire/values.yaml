# acquire addon chart.
#
# Installed by the zaentrum operator from a ZaentrumAddon: settings → addons → +
# in the portal, `zae addon add oci://ghcr.io/laedeli/charts/acquire`, or a
# ZaentrumAddon committed to a deploy repository. See docs/deploying.md.
#
# Three kinds of values:
#   - `zaentrum`: platform facts. The operator sets this block and it overrides
#     anything given here or in an install; templates read the platform from it
#     and from nowhere else.
#   - inputs: declared in values.schema.json (database, oidc, tmdb, config,
#     subtitles, endpoints, downloadsRoot, and the download clients'
#     clients.*). Secret
#     inputs are rendered into the Secret `acquire-secrets` and reach the
#     containers through secretKeyRef only.
#   - tuning: images, resources, the in-namespace service URLs.

# ── platform facts (set by the operator) ────────────────────────────────────
zaentrum:
  namespace: ""
  # The platform's host. Its portal (/portal/) hosts acquire's console, and
  # acquire sends a browser that asks it for a page to its app there
  # (/portal/app/acquire on this host); "" sends it to /portal/ on the host it
  # asked.
  hostname: ""
  # The OIDC issuer the platform services use. Required.
  issuer: ""
  # When set, pods resolve the issuer host to this address (split horizon).
  issuerHostAliasIP: ""
  imagePullSecrets: []
  partOf: ""
  events:
    brokers: ""
    topicPrefix: ""
    # Secret with user.crt, user.key and ca.crt for the event brokers (mTLS);
    # "" means plaintext brokers: nothing is mounted and both components
    # connect without TLS.
    tlsSecret: ""
  media:
    # The platform media claim; mounted read-only into acquire, which writes
    # only its arrivals (.work/incoming) when the chart runs download clients.
    claimName: ""
  vpn:
    # The platform VPN's SOCKS5 proxy, socks5h://host:port, or "" when the
    # platform has no VPN. A download client with vpn: true reaches the
    # internet through it and nothing else.
    proxy: ""

# ── inputs (values.schema.json) ─────────────────────────────────────────────
database: {}
  # url: postgres://acquire:<password>@<host>:5432/acquire?sslmode=require
  #   secret, required: acquire's own Postgres database.

oidc:
  # Confidential client acquire calls the gateway and ingest with. The gateway
  # accepts tokens from this client only.
  serviceClientId: laedeli-acquire-svc
  # serviceClientSecret: secret, required.
  # The console has no client of its own: it opens in the portal, on the
  # portal's sign-in, and calls acquire with the portal user's token.
  adminRole: zaentrum-admin
  userRole: zaentrum-user

tmdb: {}
  # apiKey: secret, optional: server-side key for discovery, and for what a
  # request follows (a series' episodes, a movie's release dates).

config: {}
  # key: secret: 32 random bytes, base64, encrypting every credential acquire
  #   stores. The operator generates one on first install when none is given.
  # previousKey: secret, optional: the key before a rotation.

# Subtitles from OpenSubtitles.com in the configured languages, for the titles
# the library holds that lack one, added to each title through the catalog
# (docs/acquire.md, "Subtitles"): new arrivals first, then the rest of the
# library, the newest first, up to a daily download limit. On by default;
# without the account and its API key below nothing is searched for, and the
# console and the setup checklist say so.
subtitles:
  enabled: true
  # The subtitle languages acquire searches for, as language tags (en, de,
  # zh-Hans). Empty: the platform's — its subtitles.languages, else the
  # packager's language whitelist, the languages its players show.
  languages: []
  # The automatic downloads a day (UTC). A free account allows 20; the rest of
  # the account's downloads are for versions you pick in the console.
  dailyBudget: 18
  opensubtitles: {}
    # username: secret: the account's name.
    # password: secret: its password.
    # apiKey: secret: the API key of an OpenSubtitles.com API consumer.

endpoints:
  # Comma list of hostnames and domain suffixes configuration may never point at.
  deny: ""
  # true allows cluster services in other namespaces.
  allowInternal: false

# Where finished downloads are visible to acquire when a download client names
# no folder of its own. The media claim is mounted at /var/lib/katalog.
downloadsRoot: /var/lib/katalog

# The download clients the addon can run itself, each optional. acquire stores
# the enabled ones as managed clients (it needs no setup for them). They work on
# the downloads claim below, not on the media storage; acquire copies each
# finished download into the library and then releases it in its client. Their
# Web UI and API are a Service in the namespace, behind the login below. See
# docs/deploying.md, "Download clients and the VPN".
clients:
  # The claim both clients work on (acquire-downloads, ReadWriteOnce): each
  # its folder of it, and acquire reads it. Rendered when a client is enabled.
  downloads:
    size: 300Gi
    # Empty: the cluster's default storage class. A local volume on a node's disk
    # suits the clients best: their writes are many and small.
    storageClassName: ""
    # A PV to bind by name. Leave empty under the operator: it refuses a
    # claim that names its volume; a PV whose claimRef names this claim binds
    # without it.
    volumeName: ""
    # Kept free on the volume: NZBGet pauses below it, and acquire hands no
    # release to a client that would leave less. Empty: a tenth of size.
    reserve: ""
    # The taints of the volume's node, which the pods working on it tolerate:
    # acquire and both clients, and no other. A local volume pins them to that
    # node; list its taints here when it has any (a node kept for GPU work, say).
    tolerations: []
  qbittorrent:
    enabled: false
    # Through the platform VPN (zaentrum.vpn.proxy): torrents, peers, trackers
    # and name lookups all go through its SOCKS5 proxy, and the pod reaches
    # nothing outside the cluster directly. Without a platform VPN, set false.
    vpn: true
    # The Web UI and API login acquire uses.
    username: acquire
    # password: secret; the operator generates one when none is given.
    # The seeding goal: a finished torrent seeds until it reaches this ratio or
    # has seeded this long, whichever comes first; then acquire removes it with
    # its data. -1 lifts a limit (and both: it seeds until removed by hand).
    seeding:
      ratio: 1
      minutes: 4320
    # Its configuration claim (settings, queue, session state).
    config:
      size: 1Gi
      # Empty: the cluster's default storage class.
      storageClassName: ""
    image:
      # Rootless: runs as its image's non-root user with a tiny init
      # (catatonit) and no root start-up step. 5.2.4, pinned by digest.
      repository: ghcr.io/home-operations/qbittorrent
      tag: 5.2.4@sha256:9307627e03981d5473aa31175ea76ed56ea3752333ca49d601b6af45e281e7ba
      pullPolicy: ""
    resources:
      requests: { cpu: 50m, memory: 256Mi }
      limits: { cpu: "2", memory: 2Gi }
  nzbget:
    enabled: false
    # NZBGet has no SOCKS5 proxy setting, so it cannot go through the platform
    # VPN: true fails the render.
    vpn: false
    username: acquire
    # password: secret; the operator generates one when none is given.
    config:
      size: 1Gi
      storageClassName: ""
    image:
      # Rootless, like qBittorrent's. 26.3, pinned by digest.
      repository: ghcr.io/home-operations/nzbget
      tag: 26.3.0@sha256:7b8c77ede65ad37b55e318a38e09249e196736c319bd3c24034f7d53a2f1ba5a
      pullPolicy: ""
    resources:
      # Repair and unpacking are CPU-heavy.
      requests: { cpu: 50m, memory: 128Mi }
      limits: { cpu: "2", memory: 1Gi }

# ── tuning ──────────────────────────────────────────────────────────────────
acquire:
  image:
    repository: ghcr.io/laedeli/acquire
    # Empty: the chart's appVersion, the git sha of this repository the chart
    # was published from (acquire's image is pushed under the same sha).
    tag: ""
    # Empty: the cluster default (Always for :latest, IfNotPresent otherwise).
    pullPolicy: ""
  resources:
    requests: { cpu: 20m, memory: 48Mi }
    limits: { cpu: 500m, memory: 256Mi }

downloadGateway:
  image:
    repository: ghcr.io/laedeli/download-gateway
    # The gateway is built in its own repository, so its tags are that
    # repository's shas, not this one's, and the appVersion fallback does not
    # apply to it. Pinned to a gateway commit this acquire speaks with; bump it
    # together with the chart version.
    tag: 11c72056542dcd4836710df8d21e877b7da4fa91
    pullPolicy: ""
  # How often the gateway polls its download clients for job state.
  pollInterval: 5s
  resources:
    requests: { cpu: 20m, memory: 32Mi }
    # Large adds carry whole release files through the gateway (up to about
    # 140 MiB in flight at once), so leave headroom above that.
    limits: { cpu: 200m, memory: 256Mi }

# In-namespace services acquire calls. The gateway component acquire declares is
# the first label of the downloadGateway host, so keep it in step with the
# gateway's Service name.
urls:
  downloadGateway: http://download-gateway
  katalog: http://katalog-api
  katalogManager: http://katalog-manager-api
